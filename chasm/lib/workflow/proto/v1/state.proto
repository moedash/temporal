syntax = "proto3";

package temporal.server.chasm.lib.workflow.proto.v1;

import "temporal/api/common/v1/message.proto";

option go_package = "go.temporal.io/server/chasm/lib/workflow/gen/workflowpb;workflowpb";

// NexusOperationParentData contains workflow-specific data stored in a nexus operation's
// parent_data field when the operation is embedded in a workflow.
message NexusOperationParentData {
  // Event ID of the NEXUS_OPERATION_SCHEDULED event.
  int64 scheduled_event_id = 1;
  // Token for loading the NEXUS_OPERATION_SCHEDULED event.
  bytes scheduled_event_token = 2;
}

// NexusCancellationParentData contains workflow-specific data stored in a nexus cancellation's
// parent_data field when the operation is embedded in a workflow.
message NexusCancellationParentData {
  // Event ID of the NEXUS_OPERATION_CANCEL_REQUESTED event.
  int64 requested_event_id = 1;
}

// IncomingSignalData records the event associated with a signal's request ID, which allows
// DescribeWorkflow to resolve RequestIDRef signal backlinks.
message IncomingSignalData {
  int64 event_id = 1;
}

// WakeEntry is a wake from one source that a completed Workflow Task has not
// yet seen. It is deleted when one has.
message WakeEntry {
  // Opaque to the server: where the source stood when it sent the wake.
  bytes position = 1;
  // Counter of the wake that set position.
  int64 counter = 2;
  // Bumped when a wake arrives after a started task carried this entry, so
  // the completion of that task leaves the newer wake pending.
  int64 generation = 3;
  // Generation handed to the last Workflow Task that started with this entry.
  int64 delivered_generation = 4;
}

// ChannelSubscription is a notification channel this run subscribed to with a
// command. It lives for the run.
message ChannelSubscription {
  // The WorkflowNotificationChannelSubscribed event that recorded it.
  int64 event_id = 1;
  // Highest counter this run accepted from the channel. Kept for describing
  // the subscription; folding compares against the pending entry instead.
  int64 last_counter = 2;
  // Counter the scheduled event of the run's current task carried, while that
  // task has not started. A repeat at or below it folds into that task, which
  // has not read anything yet. Zero once the task starts, fails or times out.
  int64 scheduled_counter = 3;
}

// ChannelNotificationEntry is the latest notification from one channel that
// no WorkflowTaskScheduled event has carried yet. Deleted when one does.
message ChannelNotificationEntry {
  bytes position = 1;
  int64 counter = 2;
  map<string, temporal.api.common.v1.Payload> metadata = 3;
}
