syntax = "proto3";

package temporal.server.chasm.lib.channel.proto.v1;

import "chasm/lib/channel/proto/v1/request_response.proto";
import "temporal/server/api/common/v1/api_category.proto";
import "temporal/server/api/routing/v1/extension.proto";

option go_package = "go.temporal.io/server/chasm/lib/channel/gen/channelpb;channelpb";

// ChannelService is served by History. The frontend reaches it for the public
// channel calls, and History reaches it to cross from a channel's shard to a
// listener's shard and back.
service ChannelService {
  rpc NotifyChannel(NotifyChannelRequest) returns (NotifyChannelResponse) {
    option (temporal.server.api.routing.v1.routing).business_id = "frontend_request.notification.channel";
    option (temporal.server.api.common.v1.api_category).category = API_CATEGORY_STANDARD;
  }

  rpc RegisterChannelListener(RegisterChannelListenerRequest) returns (RegisterChannelListenerResponse) {
    option (temporal.server.api.routing.v1.routing).business_id = "frontend_request.channel";
    option (temporal.server.api.common.v1.api_category).category = API_CATEGORY_STANDARD;
  }

  rpc UnregisterChannelListener(UnregisterChannelListenerRequest) returns (UnregisterChannelListenerResponse) {
    option (temporal.server.api.routing.v1.routing).business_id = "frontend_request.channel";
    option (temporal.server.api.common.v1.api_category).category = API_CATEGORY_STANDARD;
  }

  rpc PollChannel(PollChannelRequest) returns (PollChannelResponse) {
    option (temporal.server.api.routing.v1.routing).business_id = "frontend_request.channel";
    option (temporal.server.api.common.v1.api_category).category = API_CATEGORY_LONG_POLL;
  }

  rpc DescribeChannel(DescribeChannelRequest) returns (DescribeChannelResponse) {
    option (temporal.server.api.routing.v1.routing).business_id = "frontend_request.channel";
    option (temporal.server.api.common.v1.api_category).category = API_CATEGORY_STANDARD;
  }

  // The linked kind. Same requests, with execution set, routed to the shard
  // of the execution that holds the channel.
  rpc NotifyLinkedChannel(NotifyChannelRequest) returns (NotifyChannelResponse) {
    option (temporal.server.api.routing.v1.routing).business_id = "frontend_request.execution.business_id";
    option (temporal.server.api.common.v1.api_category).category = API_CATEGORY_STANDARD;
  }

  rpc RegisterLinkedChannelListener(RegisterChannelListenerRequest) returns (RegisterChannelListenerResponse) {
    option (temporal.server.api.routing.v1.routing).business_id = "frontend_request.execution.business_id";
    option (temporal.server.api.common.v1.api_category).category = API_CATEGORY_STANDARD;
  }

  rpc UnregisterLinkedChannelListener(UnregisterChannelListenerRequest) returns (UnregisterChannelListenerResponse) {
    option (temporal.server.api.routing.v1.routing).business_id = "frontend_request.execution.business_id";
    option (temporal.server.api.common.v1.api_category).category = API_CATEGORY_STANDARD;
  }

  rpc PollLinkedChannel(PollChannelRequest) returns (PollChannelResponse) {
    option (temporal.server.api.routing.v1.routing).business_id = "frontend_request.execution.business_id";
    option (temporal.server.api.common.v1.api_category).category = API_CATEGORY_LONG_POLL;
  }

  rpc DescribeLinkedChannel(DescribeChannelRequest) returns (DescribeChannelResponse) {
    option (temporal.server.api.routing.v1.routing).business_id = "frontend_request.execution.business_id";
    option (temporal.server.api.common.v1.api_category).category = API_CATEGORY_STANDARD;
  }

  // Internal. The completion of a Workflow Task that subscribed calls this on
  // the channel's shard, creating the channel if it is absent.
  rpc RegisterWorkflowListener(RegisterWorkflowListenerRequest) returns (RegisterWorkflowListenerResponse) {
    option (temporal.server.api.routing.v1.routing).business_id = "frontend_request.channel";
    option (temporal.server.api.common.v1.api_category).category = API_CATEGORY_STANDARD;
  }

  // Internal. The completion of a Workflow Task that unsubscribed calls this
  // on the channel's shard. A channel that is absent has no listener to drop.
  rpc UnregisterWorkflowListener(UnregisterWorkflowListenerRequest) returns (UnregisterWorkflowListenerResponse) {
    option (temporal.server.api.routing.v1.routing).business_id = "frontend_request.channel";
    option (temporal.server.api.common.v1.api_category).category = API_CATEGORY_STANDARD;
  }

  // Internal. The channel's fan-out calls this on the listener's shard.
  rpc DeliverChannelNotification(DeliverChannelNotificationRequest) returns (DeliverChannelNotificationResponse) {
    option (temporal.server.api.routing.v1.routing).business_id = "frontend_request.workflow_id";
    option (temporal.server.api.common.v1.api_category).category = API_CATEGORY_STANDARD;
  }
}
