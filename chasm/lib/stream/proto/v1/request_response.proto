syntax = "proto3";

package temporal.server.chasm.lib.stream.proto.v1;

import "chasm/lib/stream/proto/v1/message.proto";
import "chasm/lib/stream/proto/v1/stream_state.proto";
import "temporal/api/common/v1/message.proto";

option go_package = "go.temporal.io/server/chasm/lib/stream/gen/streampb;streampb";

// The frontend-facing shapes are defined here rather than in the public API
// because streams have no public API yet. Keeping them in a nested
// frontend_request mirrors the other CHASM libraries, so promoting them later
// is a package move rather than a redesign.

message CreateStreamInput {
  string namespace = 1;
  string stream_id = 2;
  StreamLifecycle lifecycle = 3;
}

message CreateStreamOutput {
  string run_id = 1;
}

message AddMessagesInput {
  string namespace = 1;
  string stream_id = 2;
  // Optional. Supplying it skips resolving the stream's current run, which is
  // a persistence lookup on every call. CreateStream returns it.
  string run_id = 9;
  repeated StreamMessage messages = 3;

  // Idempotency, all optional. Supply a producer identity and sequence, or an
  // expected offset, or neither and accept at-least-once.
  string producer_id = 4;
  int64 sequence = 5;
  // Guarded by use_expected_offset because proto3 optional is not supported
  // by this repo's helper generator.
  int64 expected_offset = 6;
  bool use_expected_offset = 8;

  int64 owner_epoch = 7;
}

message AddMessagesOutput {
  int64 first_offset = 1;
  int64 next_offset = 2;
  int64 count = 3;
  // True when a retry matched a recorded sequence and nothing was appended.
  bool deduplicated = 4;
}

message FinishWritingInput {
  string namespace = 1;
  string stream_id = 2;
  string producer_id = 3;
}

message FinishWritingOutput {}

// Registers a Workflow as a consumer of a stream it owns. The cursor lands in
// the Workflow's own state, so from then on each of its Workflow Tasks carries
// the next range and records what it consumed.
message SubscribeWorkflowInput {
  string namespace = 1;
  string workflow_id = 2;
  // Name of the stream within the Workflow, for a stream it owns.
  string stream_name = 3;
  // Id of a standalone stream in another execution. Exactly one of this and
  // stream_name is set.
  string stream_id = 5;
  // Where to start. Resolved here rather than at delivery, so the first
  // recorded range starts from a fact instead of a reading.
  int64 start_offset = 4;
}

message SubscribeWorkflowOutput {
  int64 start_offset = 1;
}

message PollMessagesInput {
  string namespace = 1;
  string stream_id = 2;
  // Optional, as on AddMessagesInput.
  string run_id = 7;
  int64 from_offset = 3;
  int32 max_messages = 4;
  // Filters by exact topic. Offsets are assigned over the unfiltered stream, so
  // next_offset advances past filtered-out messages too.
  repeated string topics = 5;

  // When set and the reader is caught up, block until something arrives, the
  // stream closes, or the server's long-poll timeout elapses. A timeout returns
  // an empty response rather than an error, so the caller simply polls again.
  bool wait_new_messages = 6;
}

message PollMessagesOutput {
  repeated StreamMessage messages = 1;
  int64 next_offset = 2;
  int64 head_offset = 3;
  bool closed = 4;
  temporal.api.common.v1.Payload close_reason = 5;
}

message DescribeStreamInput {
  string namespace = 1;
  string stream_id = 2;
}

// A stream a workflow owns lives inside that workflow's execution, so it has
// no standalone id to address it by. It is named by its owner and its name
// instead, and routed on the owner.
message PollWorkflowMessagesInput {
  string namespace = 1;
  string workflow_id = 2;
  // Empty means the workflow's default output stream.
  string stream_name = 3;
  int64 from_offset = 4;
  int32 max_messages = 5;
  // Filters as on PollMessagesInput.
  repeated string topics = 6;
  bool wait_new_messages = 7;
}

message DescribeWorkflowStreamInput {
  string namespace = 1;
  string workflow_id = 2;
  string stream_name = 3;
}

// Appending to a stream a workflow owns, from outside that workflow. The
// workflow's own publishes ride its Workflow Task instead.
message AddWorkflowMessagesInput {
  string namespace = 1;
  string workflow_id = 2;
  // Empty means the workflow's default output stream.
  string stream_name = 3;
  repeated StreamMessage messages = 4;
  // Optional idempotency, as on AddMessagesInput.
  string producer_id = 5;
  int64 sequence = 6;
}

message DescribeStreamOutput {
  StreamState state = 1;
}

message CloseStreamInput {
  string namespace = 1;
  string stream_id = 2;
  temporal.api.common.v1.Payload reason = 3;
}

message CloseStreamOutput {}

message TruncateStreamInput {
  string namespace = 1;
  string stream_id = 2;
  int64 new_base_offset = 3;
}

message TruncateStreamOutput {}

message DeleteStreamInput {
  string namespace = 1;
  string stream_id = 2;
}

message DeleteStreamOutput {}

message CreateStreamRequest {
  string namespace_id = 1;
  CreateStreamInput frontend_request = 2;
}
message CreateStreamResponse {
  CreateStreamOutput frontend_response = 1;
}

message AddMessagesRequest {
  string namespace_id = 1;
  AddMessagesInput frontend_request = 2;
}
message AddMessagesResponse {
  AddMessagesOutput frontend_response = 1;
}

message FinishWritingRequest {
  string namespace_id = 1;
  FinishWritingInput frontend_request = 2;
}
message FinishWritingResponse {
  FinishWritingOutput frontend_response = 1;
}

message SubscribeWorkflowRequest {
  string namespace_id = 1;
  SubscribeWorkflowInput frontend_request = 2;
}
message SubscribeWorkflowResponse {
  SubscribeWorkflowOutput frontend_response = 1;
}

message PollMessagesRequest {
  string namespace_id = 1;
  PollMessagesInput frontend_request = 2;
}
message PollMessagesResponse {
  PollMessagesOutput frontend_response = 1;
}

message DescribeStreamRequest {
  string namespace_id = 1;
  DescribeStreamInput frontend_request = 2;
}
message DescribeStreamResponse {
  DescribeStreamOutput frontend_response = 1;
}

message PollWorkflowMessagesRequest {
  string namespace_id = 1;
  PollWorkflowMessagesInput frontend_request = 2;
}
message PollWorkflowMessagesResponse {
  PollMessagesOutput frontend_response = 1;
}

message DescribeWorkflowStreamRequest {
  string namespace_id = 1;
  DescribeWorkflowStreamInput frontend_request = 2;
}
message DescribeWorkflowStreamResponse {
  DescribeStreamOutput frontend_response = 1;
}

// Registering a consumer on a stream in another execution. Split out from
// SubscribeWorkflow because the two halves live on different shards: the pin
// goes on the stream, the cursor goes on the consuming workflow, and a handler
// can only reach the shard it was routed to.
message RegisterStreamConsumerInput {
  string namespace = 1;
  string stream_id = 2;
  // The workflow that will consume, which names the pin.
  string consumer_workflow_id = 3;
  // Negative means from wherever the stream is when the pin is taken. Resolved
  // here, where the frontier is, and returned so the cursor records a fact.
  int64 start_offset = 4;
}

message RegisterStreamConsumerOutput {
  int64 start_offset = 1;
  // What the consumer needs to address the log, all decided by the stream.
  string collection_id = 2;
  int64 bucket_size = 3;
  int64 known_head = 4;
}

// Telling one consumer that the frontier moved. Routed to the consumer, which
// is not where the stream lives.
message AdvanceConsumerHeadInput {
  string namespace = 1;
  string workflow_id = 2;
  string stream_id = 3;
  int64 head_offset = 4;
}

message AdvanceConsumerHeadOutput {}

message AddWorkflowMessagesRequest {
  string namespace_id = 1;
  AddWorkflowMessagesInput frontend_request = 2;
}
message AddWorkflowMessagesResponse {
  AddMessagesOutput frontend_response = 1;
}

message RegisterStreamConsumerRequest {
  string namespace_id = 1;
  RegisterStreamConsumerInput frontend_request = 2;
}
message RegisterStreamConsumerResponse {
  RegisterStreamConsumerOutput frontend_response = 1;
}

message AdvanceConsumerHeadRequest {
  string namespace_id = 1;
  AdvanceConsumerHeadInput frontend_request = 2;
}
message AdvanceConsumerHeadResponse {
  AdvanceConsumerHeadOutput frontend_response = 1;
}

message CloseStreamRequest {
  string namespace_id = 1;
  CloseStreamInput frontend_request = 2;
}
message CloseStreamResponse {
  CloseStreamOutput frontend_response = 1;
}

message TruncateStreamRequest {
  string namespace_id = 1;
  TruncateStreamInput frontend_request = 2;
}
message TruncateStreamResponse {
  TruncateStreamOutput frontend_response = 1;
}

message ListStreamsInput {
  string namespace = 1;
  int32 page_size = 2;
  bytes next_page_token = 3;
  string query = 4;
}

message StreamListEntry {
  string stream_id = 1;
  string run_id = 2;
}

message ListStreamsOutput {
  repeated StreamListEntry streams = 1;
  bytes next_page_token = 2;
}

message ListStreamsRequest {
  string namespace_id = 1;
  ListStreamsInput frontend_request = 2;
}
message ListStreamsResponse {
  ListStreamsOutput frontend_response = 1;
}

message DeleteStreamRequest {
  string namespace_id = 1;
  DeleteStreamInput frontend_request = 2;
}
message DeleteStreamResponse {
  DeleteStreamOutput frontend_response = 1;
}
