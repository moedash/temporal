syntax = "proto3";

package temporal.server.chasm.lib.stream.proto.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "temporal/api/common/v1/message.proto";

option go_package = "go.temporal.io/server/chasm/lib/stream/gen/streampb;streampb";

// Size is O(producers + consumers), never O(messages). Payload bytes live in
// the log, not here, which is what keeps this off the CHASM partial-read path.
message StreamState {
  // Visibility frontier. Readers never observe an offset at or past this.
  int64 head_offset = 1;
  // Truncation floor. Offsets below this are gone.
  int64 base_offset = 2;
  // Chains log nodes so a stale node from an abandoned append is rejected on

  bool closed = 4;
  temporal.api.common.v1.Payload close_reason = 5;

  // Bumped on ownership change so a stale producer's write fails.
  int64 owner_epoch = 6;

  // Immutable once set. Offsets roll to a new log tree every bucket_size so no
  // single storage partition grows with the stream.
  int64 bucket_size = 7;

  // Identity of the log this stream writes to. Bucket trees are derived from
  // it, so there is no per-bucket index to store.
  string collection_id = 8;

  map<string, ProducerCursor> producers = 9;
  map<string, ConsumerCursor> consumers = 10;

  StreamLifecycle lifecycle = 11;

  // Set when a successor run takes ownership, so an in-flight poll can follow
  // the chain instead of stalling on a superseded run.
  string redirect_run_id = 12;

  // Wall-clock close time, used to schedule retention deletion.
  google.protobuf.Timestamp close_time = 13;
}

message ProducerCursor {
  int64 seq = 1;
  int64 first_offset = 2;
  int64 count = 3;
  // Distinguishes a genuine retry from a client reusing a sequence with
  // different content, which must be rejected rather than deduplicated.
  bytes content_hash = 4;
  // Set by FinishWriting. Ends this producer's writes without closing the
  // stream for anyone else.
  bool fenced = 5;
}

message ConsumerCursor {
  string workflow_id = 1;
  string run_id = 2;
  int64 offset = 3;
  // While true, truncation cannot advance past offset.
  bool active = 4;
  // Set when the consumer is a workflow in another execution, which is the
  // only case that has to be told the frontier moved. A workflow consuming a
  // stream it owns sees that while closing its own transaction.
  bool external = 5;
}

// A consuming Workflow's position in a stream. This lives in the consuming
// Workflow's own state rather than on the stream, so advancing it commits in
// the same transaction as the WorkflowTaskCompleted event that records the
// range. Keeping it on the stream would make the advance a cross-execution
// write, and a crash between the two would either redeliver or skip.
message WorkflowStreamCursor {
  string stream_id = 1;
  // Enough to address the log without reading the stream component first.
  string collection_id = 2;
  int64 bucket_size = 3;

  // Next offset to deliver.
  int64 offset = 4;

  // The stream's frontier as of the last delivery. A workflow consuming a
  // stream in another execution cannot read the real frontier while closing its
  // own transaction, so this is what tells it a capped slice left more behind.
  int64 known_head = 8;

  // Set when the stream lives in another execution, which decides whether the
  // frontier is read locally or taken from known_head.
  bool external = 9;

  // The range attached to the Workflow Task currently in flight. Recorded on
  // the event that closes that task, then folded into offset. An empty range
  // is still recorded: a task where the subscription saw nothing is a fact
  // replay has to reproduce.
  int64 pending_from = 5;
  int64 pending_to = 6;
  bool has_pending = 7;
}

message StreamLifecycle {
  // How long a closed stream stays readable before it is deleted.
  google.protobuf.Duration retention = 1;
  // Cap on readable messages. Older whole buckets are reclaimed once the floor
  // passes them, so a capped stream has bounded storage.
  int64 max_items = 2;
}
