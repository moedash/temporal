syntax = "proto3";

package temporal.server.chasm.lib.stream.proto.v1;

option go_package = "go.temporal.io/server/chasm/lib/stream/gen/streampb;streampb";

// Fires at close_time plus retention. A closed stream stays readable until
// then, which is what removes the shutdown handshake the signal-based
// implementation forces on producers and consumers.
message StreamRetentionTask {}

// Fires after an append that leaves a registered consumer behind. Appending
// never schedules a workflow task on its own, because a stream item is data an
// execution produced rather than a decision input to it. A workflow that
// subscribed is the exception: it asked to be told, and it cannot find out any
// other way, since nothing else it does would notice the stream moved.
message StreamNotifyConsumersTask {}

// Fires when the oldest batch of an open stream may have aged past the
// lifecycle's retention. It truncates what aged, stopping at an active
// consumer's floor, and re-arms itself while the stream holds records.
message StreamAgeTask {}

// Fires after a change to a stream whose channel lives in another execution:
// a standalone stream, or one a standalone activity owns. One is outstanding
// at a time and reads the latest change when it runs, so changes reach the
// channel in order and a burst reaches it as its newest change.
message StreamNotifyChannelTask {
  string channel = 1;
  // What a native position pairs the offset with: the owning run, or the
  // stream's own id for a standalone stream.
  string run = 2;
}
